[package]
name = "hackeros-educator"
version = "0.1.0"
description = "HackerOS Educator — darmowa, open-source platforma do nauki cyberbezpieczeństwa"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "hackeros_educator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"

[[bin]]
name = "hackeros-educator"
path = "src/main.rs"
